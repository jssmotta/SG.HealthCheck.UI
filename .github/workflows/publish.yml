# Build, pack, and publish NuGet.org packages via Trusted Publishing (OIDC).
# Configure a policy at nuget.org → Trusted Publishing for this repo, workflow file publish.yml,
# and (recommended) environment production. NuGet username: repository variable NUGET_USERNAME.
# Version: workflow_dispatch input, git tag v*, or auto patch-bump from NuGet.org on main.
name: Publish to NuGet

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (e.g. 1.2.3). Overrides tag/variable defaults when set."
        required: false
        type: string

env:
  DOTNET_NO_LOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Use Node 24 for setup-node; opt Actions runtime to Node 24 (see GitHub deprecation of Node 20).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Auto patch-bump reads latest stable SG.HealthChecks.UI from NuGet.org (see Resolve package version).
  CONFIGURATION: Release
  NODE_VERSION: "24"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js (HealthChecks.UI webpack)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/HealthChecks.UI/package-lock.json

      - name: Resolve package version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          NUGET_PACKAGE_ID: sg.healthchecks.ui
        run: |
          set -euo pipefail

          bump_patch() {
            local ver="${1%%-*}"
            local major minor patch
            IFS='.' read -r major minor patch <<< "$ver"
            patch=$((10#${patch:-0} + 1))
            echo "${major}.${minor}.${patch}"
          }

          resolve_from_nuget() {
            local index_url="https://api.nuget.org/v3-flatcontainer/${NUGET_PACKAGE_ID}/index.json"
            local http_code
            http_code="$(curl -sS -o /tmp/nuget-index.json -w "%{http_code}" "$index_url")"
            if [ "$http_code" = "404" ]; then
              echo "1.0.0"
              return
            fi
            if [ "$http_code" != "200" ]; then
              echo "NuGet index request failed with HTTP ${http_code}" >&2
              exit 1
            fi
            local latest_stable
            latest_stable="$(jq -r '.versions[] | select(contains("-") | not)' /tmp/nuget-index.json | sort -V | tail -n1)"
            if [ -z "$latest_stable" ]; then
              echo "1.0.0"
            else
              bump_patch "$latest_stable"
            fi
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION:-}" ]; then
            VER="${INPUT_VERSION}"
            echo "Version source: workflow_dispatch input"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            echo "Version source: git tag"
          else
            VER="$(resolve_from_nuget)"
            echo "Version source: NuGet.org auto patch-bump (${NUGET_PACKAGE_ID})"
          fi

          echo "Using PACKAGE_VERSION=${VER}"
          echo "PACKAGE_VERSION=${VER}" >> "${GITHUB_ENV}"

      - name: Restore
        run: dotnet restore "src/src.sln"

      - name: Build
        run: dotnet build "src/src.sln" -c "${CONFIGURATION}" --no-restore -p:Version="${PACKAGE_VERSION}" -p:PackageVersion="${PACKAGE_VERSION}"

      - name: Test
        run: dotnet test "src/src.sln" -c "${CONFIGURATION}" --no-build --verbosity minimal

      - name: Pack libraries (src)
        run: dotnet pack "src/src.sln" -c "${CONFIGURATION}" --no-build -o "${GITHUB_WORKSPACE}/artifacts/nuget" -p:Version="${PACKAGE_VERSION}" -p:PackageVersion="${PACKAGE_VERSION}"

      - name: Pack meta-package (repository root)
        run: dotnet pack "SG.HealthCheck.csproj" -c "${CONFIGURATION}" -o "${GITHUB_WORKSPACE}/artifacts/nuget" -p:Version="${PACKAGE_VERSION}" -p:PackageVersion="${PACKAGE_VERSION}"

      # Exchanges GitHub OIDC for a short-lived NuGet.org API key (Trusted Publishing).
      - name: NuGet login (OIDC)
        if: github.event_name != 'pull_request'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USERNAME }}

      - name: Publish to NuGet.org
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          dotnet nuget push "${GITHUB_WORKSPACE}/artifacts/nuget"/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
