# Build, pack, and publish NuGet.org packages via Trusted Publishing (OIDC).
# Configure a policy at nuget.org → Trusted Publishing for this repo, workflow file publish.yml,
# and (recommended) environment production. NuGet username: repository variable NUGET_USERNAME.
# Version: PACKAGE_VERSION variable, git tag v*, workflow_dispatch input, or CI default.
name: Publish to NuGet

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (e.g. 1.2.3). Overrides tag/variable defaults when set."
        required: false
        type: string

env:
  DOTNET_NO_LOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Optional: set a repository/org variable named PACKAGE_VERSION to pin a default for main-branch builds.
  CONFIGURATION: Release
  NODE_VERSION: "20"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js (HealthChecks.UI webpack)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/HealthChecks.UI/package-lock.json

      - name: Resolve package version
        shell: bash
        env:
          REPO_PACKAGE_VERSION: ${{ vars.PACKAGE_VERSION }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION:-}" ]; then
            VER="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${REPO_PACKAGE_VERSION:-}" ]; then
            VER="${REPO_PACKAGE_VERSION}"
          else
            VER="1.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "Using PACKAGE_VERSION=${VER}"
          echo "PACKAGE_VERSION=${VER}" >> "${GITHUB_ENV}"

      - name: Restore
        run: dotnet restore "src/src.sln"

      - name: Build
        run: dotnet build "src/src.sln" -c "${CONFIGURATION}" --no-restore -p:Version="${PACKAGE_VERSION}" -p:PackageVersion="${PACKAGE_VERSION}"

      - name: Test
        run: dotnet test "src/src.sln" -c "${CONFIGURATION}" --no-build --verbosity minimal

      - name: Pack libraries (src)
        run: dotnet pack "src/src.sln" -c "${CONFIGURATION}" --no-build -o "${GITHUB_WORKSPACE}/artifacts/nuget" -p:Version="${PACKAGE_VERSION}" -p:PackageVersion="${PACKAGE_VERSION}"

      - name: Pack meta-package (repository root)
        run: dotnet pack "SG.HealthCheck.csproj" -c "${CONFIGURATION}" -o "${GITHUB_WORKSPACE}/artifacts/nuget" -p:Version="${PACKAGE_VERSION}" -p:PackageVersion="${PACKAGE_VERSION}"

      # Exchanges GitHub OIDC for a short-lived NuGet.org API key (Trusted Publishing).
      - name: NuGet login (OIDC)
        if: github.event_name != 'pull_request'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USERNAME }}

      - name: Publish to NuGet.org
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          dotnet nuget push "${GITHUB_WORKSPACE}/artifacts/nuget"/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
